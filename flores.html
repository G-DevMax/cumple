<svg viewBox="0 0 1200 450" width="100%" height="100%">
    <defs>
        <!-- Filters & Shadows -->
        <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="4" flood-color="#142610" flood-opacity="0.25" />
        </filter>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" flood-color="#000" flood-opacity="0.18" />
        </filter>

        <!-- Gradients for Leaves -->
        <linearGradient id="leafDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2d5a27" />
            <stop offset="100%" stop-color="#183615" />
        </linearGradient>
        <linearGradient id="leafMid" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4e8c37" />
            <stop offset="100%" stop-color="#2a5a1e" />
        </linearGradient>
        <linearGradient id="leafBright" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#73b342" />
            <stop offset="100%" stop-color="#3d7a22" />
        </linearGradient>
        <linearGradient id="fernGrad" x1="0%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#3c7329" />
            <stop offset="100%" stop-color="#1b4012" />
        </linearGradient>

        <!-- Gradients for Sunflowers -->
        <linearGradient id="sunPetalGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#e68a00" />
            <stop offset="40%" stop-color="#ffb703" />
            <stop offset="100%" stop-color="#ffd13b" />
        </linearGradient>
        <linearGradient id="sunPetalGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#d97706" />
            <stop offset="50%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#fef08a" />
        </linearGradient>
        <radialGradient id="sunDisk" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2b1406" />
            <stop offset="60%" stop-color="#3d1d08" />
            <stop offset="85%" stop-color="#5c2e0b" />
            <stop offset="92%" stop-color="#8a4b08" />
            <stop offset="100%" stop-color="#b46a06" />
        </radialGradient>

        <!-- Gradients for Daisy -->
        <linearGradient id="daisyPetal" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#dce6d5" />
            <stop offset="25%" stop-color="#f4f7f2" />
            <stop offset="100%" stop-color="#ffffff" />
        </linearGradient>
        <radialGradient id="daisyCenter" cx="45%" cy="45%" r="50%">
            <stop offset="0%" stop-color="#ffe033" />
            <stop offset="65%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#b45309" />
        </radialGradient>

        <!-- RED ROSES GRADIENTS (Velvety deep crimson & ruby) -->
        <linearGradient id="roseRedOuter" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b91c1c" />
            <stop offset="60%" stop-color="#880e1a" />
            <stop offset="100%" stop-color="#4a040b" />
        </linearGradient>
        <linearGradient id="roseRedMid" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#640711" />
            <stop offset="50%" stop-color="#a81523" />
            <stop offset="100%" stop-color="#d32f2f" />
        </linearGradient>
        <radialGradient id="roseRedCore" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#e53935" />
            <stop offset="60%" stop-color="#8e0a17" />
            <stop offset="100%" stop-color="#3b0308" />

        <!-- Botanical Foliage Symbols -->
        <g id="fern-frond">
            <path d="M0,0 Q30,-40 50,-140" fill="none" stroke="#255018" stroke-width="2.5" stroke-linecap="round" />
            <path d="M12,-25 C0,-30 -25,-32 -32,-28 C-25,-22 -5,-20 12,-20 Z" fill="url(#fernGrad)" />
            <path d="M15,-23 C28,-28 48,-28 55,-24 C46,-18 30,-18 15,-18 Z" fill="url(#fernGrad)" />
            <path d="M22,-48 C8,-55 -18,-58 -26,-52 C-18,-45 2,-43 22,-43 Z" fill="url(#fernGrad)" />
            <path d="M25,-46 C38,-53 58,-53 64,-47 C55,-40 38,-40 25,-41 Z" fill="url(#fernGrad)" />
            <path d="M30,-72 C18,-80 -6,-82 -15,-76 C-8,-70 11,-67 30,-67 Z" fill="url(#fernGrad)" />
            <path d="M33,-70 C46,-78 63,-75 68,-70 C60,-63 45,-63 33,-65 Z" fill="url(#fernGrad)" />
            <path d="M37,-95 C28,-103 8,-104 0,-99 C6,-94 22,-91 37,-90 Z" fill="url(#fernGrad)" />
            <path d="M40,-94 C50,-101 64,-97 68,-93 C60,-87 49,-87 40,-89 Z" fill="url(#fernGrad)" />
            <path d="M44,-118 C38,-124 23,-124 16,-120 C22,-116 33,-114 44,-114 Z" fill="url(#fernGrad)" />
            <path d="M46,-117 C54,-123 64,-120 66,-116 C60,-111 52,-111 46,-113 Z" fill="url(#fernGrad)" />
            <path d="M50,-140 C46,-150 49,-155 50,-158 C52,-154 55,-149 50,-140 Z" fill="url(#leafBright)" />

        <g id="leaf-cluster">

            <path d="M0,0 Q10,-50 35,-95 C45,-85 30,-45 0,0 Z" fill="url(#leafMid)" />
            <path d="M0,0 Q-10,-35 0,-70 C10,-60 10,-35 0,0 Z" fill="url(#leafBright)" />
            <path d="M0,0 Q-35,-20 -70,-35 C-65,-45 -35,-40 0,0 Z" fill="url(#leafDark)" />
            <path d="M0,0 Q35,-20 75,-30 C75,-42 40,-35 0,0 Z" fill="url(#leafMid)" />

        <g id="eucalyptus-branch">
            <path d="M0,0 Q-20,-50 -25,-120" fill="none" stroke="#335c2b" stroke-width="2" />
            <ellipse cx="-12" cy="-25" rx="14" ry="10" transform="rotate(-25 -12 -25)" fill="#588e4b" />
            <ellipse cx="10" cy="-40" rx="15" ry="11" transform="rotate(20 10 -40)" fill="#689f5a" />
            <ellipse cx="-18" cy="-65" rx="13" ry="9" transform="rotate(-30 -18 -65)" fill="#588e4b" />
            <ellipse cx="8" cy="-80" rx="14" ry="10" transform="rotate(25 8 -80)" fill="#689f5a" />
            <ellipse cx="-12" cy="-105" rx="11" ry="8" transform="rotate(-20 -12 -105)" fill="#78af6a" />
            <ellipse cx="-25" cy="-120" rx="9" ry="7" fill="#88bf7a" />

                <path d="M-6,0 C-10,-35 -14,-58 0,-72 C14,-58 10,-35 6,0 Z" transform="rotate(120)" />
                <path d="M-6,0 C-10,-35 -14,-58 0,-72 C14,-58 10,-35 6,0 Z" transform="rotate(135)" />
                <path d="M-6,0 C-10,-35 -14,-58 0,-72 C14,-58 10,-35 6,0 Z" transform="rotate(150)" />

                <path d="M-6,0 C-10,-35 -14,-58 0,-72 C14,-58 10,-35 6,0 Z" transform="rotate(195)" />
                <path d="M-6,0 C-10,-35 -14,-58 0,-72 C14,-58 10,-35 6,0 Z" transform="rotate(210)" />

            <g fill="url(#sunPetalGrad1)" transform="rotate(7.5)">

                <path d="M-5,0 C-8,-30 -12,-52 0,-66 C12,-52 8,-30 5,0 Z" transform="rotate(20)" />

                <path d="M-5,0 C-8,-30 -12,-52 0,-66 C12,-52 8,-30 5,0 Z" transform="rotate(140)" />
                <path d="M-5,0 C-8,-30 -12,-52 0,-66 C12,-52 8,-30 5,0 Z" transform="rotate(160)" />
                <path d="M-5,0 C-8,-30 -12,-52 0,-66 C12,-52 8,-30 5,0 Z" transform="rotate(180)" />
                <path d="M-5,0 C-8,-30 -12,-52 0,-66 C12,-52 8,-30 5,0 Z" transform="rotate(200)" />
                <path d="M-5,0 C-8,-30 -12,-52 0,-66 C12,-52 8,-30 5,0 Z" transform="rotate(220)" />

                <path d="M-5,0 C-8,-30 -12,-52 0,-66 C12,-52 8,-30 5,0 Z" transform="rotate(300)" />
                <path d="M-5,0 C-8,-30 -12,-52 0,-66 C12,-52 8,-30 5,0 Z" transform="rotate(320)" />
                <path d="M-5,0 C-8,-30 -12,-52 0,-66 C12,-52 8,-30 5,0 Z" transform="rotate(340)" />
            </g>
            <circle cx="0" cy="0" r="28" fill="url(#sunDisk)" />
            <circle cx="0" cy="0" r="24" fill="none" stroke="#7a3e0a" stroke-width="2.5" stroke-dasharray="2,3" />
            <circle cx="0" cy="0" r="18" fill="none" stroke="#4a2205" stroke-width="3" stroke-dasharray="2,2" />
            <circle cx="0" cy="0" r="10" fill="#260f02" />
        </g>

        <!-- Daisy Symbol -->
        <g id="daisy" filter="url(#drop-shadow)">
            <g fill="url(#daisyPetal)">
                <ellipse cx="0" cy="-32" rx="7.5" ry="20" />
                <ellipse cx="0" cy="-32" rx="7.5" ry="20" transform="rotate(22.5)" />
                <ellipse cx="0" cy="-32" rx="7.5" ry="20" transform="rotate(45)" />
                <ellipse cx="0" cy="-32" rx="7.5" ry="20" transform="rotate(67.5)" />
                <ellipse cx="0" cy="-32" rx="7.5" ry="20" transform="rotate(90)" />

                <ellipse cx="0" cy="-32" rx="7.5" ry="20" transform="rotate(135)" />

            </g>
            <circle cx="0" cy="0" r="15" fill="url(#daisyCenter)" />
            <circle cx="0" cy="0" r="12" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="2,2" />
        </g>

        <!-- Deep Red Garden Rose Symbol -->
        <g id="red-rose" filter="url(#drop-shadow)">

            <path d="M-55,-10 C-65,-45 -20,-68 0,-60 C20,-68 65,-45 55,-10 C68,25 25,65 0,60 C-25,65 -68,25 -55,-10 Z"

            <path d="M-45,-45 C-10,-70 40,-65 52,-35 C65,-5 45,50 15,55 C-25,60 -60,20 -55,-20 Z"
                fill="url(#roseRedMid)" opacity="0.95" />

            <path d="M-38,-25 C-30,-50 20,-55 40,-30 C55,-5 35,40 5,42 C-25,45 -48,0 -38,-25 Z" fill="#991b1b"
                stroke="#540b0e" stroke-width="1" />
            <path d="M-28,30 C-45,10 -35,-30 -10,-38 C20,-45 42,-15 32,20 C22,48 -10,48 -28,30 Z"
                fill="url(#roseRedOuter)" stroke="#49080c" stroke-width="1.2" />
            <!-- Inner cupped petals -->
            <path d="M-22,-18 C-10,-32 20,-32 26,-12 C32,8 15,26 -5,25 C-25,24 -30,-5 -22,-18 Z" fill="#b91c1c"
                stroke="#4a040b" stroke-width="1.2" />
            <path d="M-15,15 C-25,5 -20,-18 -5,-22 C12,-26 24,-8 18,12 C12,28 -5,25 -15,15 Z"
                fill="url(#roseRedCore)" />

            <path d="M-8,-8 C2,-16 14,-10 12,2 C10,12 -4,14 -8,6 C-11,0 -6,-6 -2,-5 C3,-4 4,2 0,4" fill="none"
                stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" />
        </g>

        <!-- Small filler blossom -->
        <g id="filler-bloom">
            <circle cx="-6" cy="-4" r="4.5" fill="#ffffff" />
            <circle cx="6" cy="-4" r="4.5" fill="#ffffff" />
            <circle cx="0" cy="6" r="4.5" fill="#ffffff" />
            <circle cx="-5" cy="5" r="4" fill="#ffffff" />
            <circle cx="5" cy="5" r="4" fill="#ffffff" />

    <!-- ================= BACKGROUND BOTANICAL LAYER ================= -->

        <use href="#fern-frond" transform="translate(420, 260) rotate(155) scale(0.9)" />
        <use href="#fern-frond" transform="translate(600, 270) rotate(180) scale(0.95)" />
        <use href="#fern-frond" transform="translate(780, 260) rotate(-155) scale(0.9)" />
        <use href="#leaf-cluster" transform="translate(500, 250) rotate(140) scale(0.9)" />
        <use href="#leaf-cluster" transform="translate(700, 250) rotate(-140) scale(0.9)" />

    <g id="filler-layer">
        <use href="#filler-bloom" transform="translate(340, 160) scale(1.1)" />
        <use href="#filler-bloom" transform="translate(360, 250) scale(1)" />
        <use href="#filler-bloom" transform="translate(450, 130) scale(1.2)" />
        <use href="#filler-bloom" transform="translate(550, 125) scale(0.9)" />

    <!-- ================= MAIN FLORAL GARLAND (Red Roses + Sunflowers + Daisies) ================= -->

        <use href="#red-rose" transform="translate(600, 215) scale(1.2)" />
        <use href="#sunflower" transform="translate(600, 285) rotate(18) scale(0.82)" />

        <use href="#daisy" transform="translate(535, 145) rotate(-12) scale(0.75)" />
        <use href="#daisy" transform="translate(665, 145) rotate(12) scale(0.75)" />

        <use href="#daisy" transform="translate(730, 235) rotate(18) scale(0.85)" />
        <use href="#daisy" transform="translate(840, 260) rotate(-15) scale(0.8)" />
        <use href="#daisy" transform="translate(750, 150) rotate(-8) scale(0.68)" />
